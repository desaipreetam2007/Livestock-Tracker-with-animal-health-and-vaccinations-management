<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Tracker</title>
</head>

<body>

    <h1>Livestock Health Tracker</h1>

    <h2>Register an Animal</h2>

    <form id="animalForm">

        <label for="name">Animal Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label for="type">Animal Type:</label>
        <select id="type" required>
            <option value="">Select type</option>
            <option value="Cow">Cow</option>
            <option value="Buffalo">Buffalo</option>
            <option value="Goat">Goat</option>
            <option value="Sheep">Sheep</option>
        </select>
        <br><br>

        <label for="breed">Breed:</label>
        <input type="text" id="breed" required>
        <br><br>

        <button type="submit">Register Animal</button>

    </form>

    <p id="message"></p>


    <hr>

    <h2>Animal Management</h2>

    <button type="button" id="refreshAnimals">
        Refresh Animals
    </button>
    <button type="button" id="showAnimalTrash">
        Recently Deleted Animals
    </button>

    <p id="animalListMessage" aria-live="polite">
        Animals haven't loaded yet.
    </p>



    <div id="animalList"></div>

    <div id="animalTrashContainer" hidden></div>


    <hr>

    <h2>Vaccination Overview</h2>

    <button type="button" id="refreshVaccinations">
        Refresh overview
    </button>

    <p id="vaccinationMessage" aria-live="polite">
        Vaccination overview hasn't loaded yet.
    </p>

    <div id="vaccinationSummary"></div>

    <div id="vaccinationList"></div>


    <script src="app.js" defer></script>
</body>

</html>
